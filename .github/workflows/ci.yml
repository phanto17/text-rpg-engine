name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let both platforms finish so an OS-specific failure is visible on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RpgEngine.slnx

      # Warnings are already errors via Directory.Build.props.
      - name: Build
        run: dotnet build RpgEngine.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RpgEngine.slnx -c Release --no-build

      - name: Set up Python art tooling
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install art tooling
        run: python -m pip install -r Tools/ArtPipeline/requirements.txt

      - name: Test art tooling
        run: python -m unittest discover -s Tools/ArtPipeline/tests -v

      - name: Validate reviewed art
        run: python Tools/ArtPipeline/validate_assets.py Data/Assets
